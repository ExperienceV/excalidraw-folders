[package]
name = "board-app"
edition.workspace = true
version.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
board-core = { version = "0.1.0", path = "../core" }
png = "0.18"
pollster = "1.0.1"
rfd = "0.18.0"
serde_json = "1.0.154"
vello = "0.12.0"
winit = "0.31.0-beta.4"
